<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <!-- Use Atom -->
  {% feed_meta %}
  <!-- Use RSS-2.0 -->
  <!--<link href="{{ site.github.url }}/rss-feed.xml" type="application/rss+xml" rel="alternate" title="{{ site.title }} | {{ site.description }}"/>
  //-->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=Quattrocento+Sans:wght@400;700&amp;family=Source+Code+Pro&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- Use the portfolio brand as the homepage search-result title. -->
  {% if page.url == '/' %}
  <title>{{ site.title }} | {{ site.tagline }}</title>
  <meta property="og:title" content="{{ site.title }} | {{ site.tagline }}">
  <meta name="twitter:title" content="{{ site.title }} | {{ site.tagline }}">
  {% seo title=false %}
  {% else %}
  {% seo %}
  {% endif %}

</head>
